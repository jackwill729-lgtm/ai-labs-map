<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Frontier AI Labs Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<style>
html,body{margin:0;height:100%;background:#111;font-family:system-ui,sans-serif;color:#eee}
#map{position:absolute;inset:0}
#panel{position:absolute;z-index:1000;top:10px;left:10px;width:230px;max-height:calc(100% - 20px);overflow:auto;background:rgba(20,22,28,.9);border-radius:12px;padding:8px 10px;box-shadow:0 4px 20px #0008}
#panel h1{font-size:15px;margin:2px 0 6px}#panel.closed ul{display:none}
#panel ul{list-style:none;margin:0;padding:0}#panel li{padding:6px 4px;border-top:1px solid #333;cursor:pointer;font-size:13px}
#panel li:hover{background:#2a2f3a}#panel li small{color:#999;display:block}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 8px currentColor}
.leaflet-tooltip.lbl{background:rgba(15,15,20,.85);color:#fff;border:1px solid #555;font-weight:600;font-size:12px;padding:2px 6px;box-shadow:none}
.leaflet-tooltip.lbl:before{display:none}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#1d2028;color:#eee}.leaflet-popup-content a{color:#7cc4ff}
.marker-cluster div{background:#3b82f6;color:#fff;font-weight:700}.marker-cluster{background:rgba(59,130,246,.35)}
#toggle{float:right;background:none;border:0;color:#aaa;font-size:16px;cursor:pointer}
</style></head><body><div id="map"></div>
<div id="panel"><button id="toggle">☰</button><h1>Frontier AI Labs</h1><ul id="list"></ul></div>
<script>
// [name, models, address, lat, lng, url, colour, labelDir]
const L_ = [
["OpenAI","GPT, o-series, Sora","1455 3rd St, Mission Bay, San Francisco, CA 94158",37.7701,-122.3890,"https://openai.com","#10a37f","right","San Francisco, USA"],
["Anthropic","Claude","500 Howard St, San Francisco, CA 94105 (new HQ at 300 Howard St planned for 2027)",37.7881,-122.3964,"https://anthropic.com","#d97757","top","San Francisco, USA"],
["Thinking Machines Lab","Tinker, Inkling","2300 Harrison St, Mission District, San Francisco, CA 94110",37.7605,-122.4125,"https://thinkingmachines.ai","#a78bfa","left","San Francisco, USA"],
["xAI","Grok","1450 Page Mill Rd, Palo Alto, CA",37.4128,-122.1460,"https://x.ai","#e5e7eb","left","Palo Alto, USA"],
["Safe Superintelligence (SSI)","None released yet","317 University Ave, Unit 2, Palo Alto, CA 94301 (also Tel Aviv office)",37.4467,-122.1608,"https://ssi.inc","#f472b6","top","Palo Alto, USA"],
["Meta Superintelligence Labs","Llama","1 Hacker Way, Menlo Park, CA 94025 (Meta HQ)",37.4845,-122.1472,"https://ai.meta.com","#0866ff","left","Menlo Park, USA"],
["Nvidia","Nemotron","2788 San Tomas Expy, Santa Clara, CA 95051",37.3707,-121.9638,"https://nvidia.com","#76b900","right","Santa Clara, USA"],
["Google DeepMind","Gemini","Platform 37, 6 King's Boulevard, King's Cross, London N1C 4BU",51.5345,-0.1250,"https://deepmind.google","#4285f4","right","London, UK"],
["Microsoft AI","MAI models, Copilot","One Microsoft Way, Redmond, WA (Suleyman's team mainly in Mountain View, CA)",47.6423,-122.1369,"https://microsoft.ai","#f25022","right","Redmond, USA"],
["Amazon (AGI)","Nova","410 Terry Ave N, Seattle, WA 98109 (Amazon HQ)",47.6222,-122.3366,"https://amazon.science","#ff9900","left","Seattle, USA"],
["Mistral AI","Mistral, Magistral","15 rue des Halles, 75001 Paris (registered office); new HQ: Marcadet-Belvédère, 92-104 rue des Poissonniers, 75018",48.8603,2.3467,"https://mistral.ai","#fa520f","right","Paris, France"],
["Cohere","Command, Aya","171 John St, Suite 200, Toronto, ON M5T 1X3",43.6505,-79.3910,"https://cohere.com","#39594d","right","Toronto, Canada"],
["DeepSeek","DeepSeek-V / R","Huijin International Bldg, 169 Huancheng North Rd, Gongshu, Hangzhou (registered office)",30.2850,120.1660,"https://deepseek.com","#4d6bfe","left","Hangzhou, China"],
["Alibaba (Qwen)","Qwen","969 Wenyi West Rd, Yuhang, Hangzhou (Alibaba Xixi campus)",30.2799,120.0259,"https://qwen.ai","#ff6a00","right","Hangzhou, China"],
["Moonshot AI","Kimi","13F, Bldg 1, JD Technology Bldg, 76 Zhichun Rd, Haidian, Beijing",39.9765,116.3420,"https://moonshot.ai","#9ca3af","left","Beijing, China"],
["Zhipu AI (Z.ai)","GLM","10F, Bldg 9, Yard 1, Zhongguancun East Rd, Haidian, Beijing",39.9925,116.3330,"https://z.ai","#22d3ee","right","Beijing, China"],
["ByteDance Seed","Doubao / Seed","ByteDance Beijing HQ, 48 Zhichun Rd, Haidian, Beijing",39.9770,116.3170,"https://seed.bytedance.com","#fe2c55","bottom","Beijing, China"],
["MiniMax","MiniMax-M","11F, Bldg B, Xinyan Mansion, 65 Guiqing Rd, Xuhui, Shanghai",31.1720,121.3960,"https://minimax.io","#f43f5e","right","Shanghai, China"]];
const map=L.map('map',{worldCopyJump:true,zoomControl:false}).setView([35,-30],2);
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',{attribution:'Tiles &copy; Esri',maxZoom:16}).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}',{maxZoom:16,pane:'shadowPane'}).addTo(map);
const cl=L.markerClusterGroup({disableClusteringAtZoom:9,showCoverageOnHover:false,maxClusterRadius:45});
const list=document.getElementById('list');
L_.forEach(([n,m,a,la,lo,u,c,d,city])=>{
 const off={right:[10,0],left:[-10,0],top:[0,-10],bottom:[0,10]}[d];
 const mk=L.marker([la,lo],{icon:L.divIcon({className:'',html:`<div class="dot" style="background:${c};color:${c}"></div>`,iconSize:[18,18],iconAnchor:[9,9]})})
  .bindTooltip(n,{permanent:true,direction:d,offset:off,className:'lbl'})
  .bindPopup(`<b>${n}</b><br>Models: ${m}<br>HQ: ${a}<br><a href="${u}" target="_blank" rel="noopener">${u.replace('https://','')}</a>`);
 cl.addLayer(mk);
 const li=document.createElement('li');li.innerHTML=`${n}<small>${city}</small>`;
 li.onclick=()=>{map.flyTo([la,lo],12);setTimeout(()=>mk.openPopup(),1600);if(innerWidth<600)panel.classList.add('closed')};
 list.appendChild(li);});
map.addLayer(cl);map.fitBounds(cl.getBounds(),{padding:[30,30]});
const panel=document.getElementById('panel');document.getElementById('toggle').onclick=()=>panel.classList.toggle('closed');
if(innerWidth<600)panel.classList.add('closed');
</script></body></html>
