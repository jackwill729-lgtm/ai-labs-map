, "dc": [], "gap": "Public data on Chinese labs' datacenters is thin; no verified sites are mapped."}, {"n": "Amazon (AGI)", "ad": "410 Terry Ave N, Seattle, WA 98109 (Amazon HQ)", "la": 47.6222, "lo": -122.3366, "u": "https://amazon.science", "c": "#ff9900", "d": "left", "city": "Seattle, USA", "rank": 15, "top": "Nova 2.0 Pro Preview", "score": 14, "desc": "Amazon's AGI organisation is led by Peter DeSantis, with Pieter Abbeel heading frontier model research. In mid-2026 Amazon wound down most Nova models to focus on that effort. AWS is Anthropic's main cloud and training partner (Project Rainier).", "dc": [["AWS Project Rainier", "New Carlisle, Indiana", 41.7, -86.51, "Amazon (AWS)", "~910 MW online; built for Anthropic", 1]], "gap": ""}, {"n": "Cohere", "ad": "171 John St, Suite 200, Toronto, ON M5T 1X3", "la": 43.6505, "lo": -79.391, "u": "https://cohere.com", "c": "#39594d", "d": "right", "city": "Toronto, Canada", "rank": 16, "top": "Command A+", "score": 13, "desc": "Founded 2019 in Toronto by Aidan Gomez (CEO), Ivan Zhang and Nick Frosst. Focuses on enterprise models (Command, Aya). Announced a merger with Germany's Aleph Alpha in April 2026.", "dc": [["CoreWeave Cambridge", "Cambridge, Ontario", 43.4, -80.33, "CoreWeave", "~52 MW preleased, partly operating since mid-2025", 1]], "gap": ""}, {"n": "Microsoft AI", "ad": "One Microsoft Way, Redmond, WA (Suleyman's team mainly in Mountain View, CA)", "la": 47.6423, "lo": -122.1369, "u": "https://microsoft.ai", "c": "#f25022", "d": "right", "city": "Redmond, USA", "rank": 17, "top": "Phi-4 (MAI models not indexed)", "score": 6, "desc": "Formed March 2024 under Mustafa Suleyman (DeepMind and Inflection co-founder). Since March 2026 Suleyman runs the MAI Superintelligence division while Jacob Andreou leads Copilot. Released seven in-house MAI models in June 2026, including MAI-Thinking-1 (not yet on the Artificial Analysis index).", "dc": [["Fairwater Wisconsin", "Mount Pleasant, Wisconsin", 42.71, -87.91, "Micro const map=L.map('map',{worldCopyJump:true,zoomControl:false,minZoom:innerWidth<600?1:2}).setView([35,-30],2);
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',{attribution:'Tiles &copy; Esri',maxZoom:16}).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}',{maxZoom:16,pane:'shadowPane'}).addTo(map);
const cl=L.markerClusterGroup({disableClusteringAtZoom:9,showCoverageOnHover:false,maxClusterRadius:45});
const dcLayer=L.layerGroup().addTo(map);
const list=document.getElementById('list'),panel=document.getElementById('panel'),info=document.getElementById('info');
const markers={};
function select(l){
 dcLayer.clearLayers();
 const pts=[[l.la,l.lo]];
 l.dc.forEach(([nm,loc,la,lo,own,size,approx])=>{pts.push([la,lo]);
  L.marker([la,lo],{icon:L.divIcon({className:'',html:`<div class="dc" style="border-color:${l.c}"></div>`,iconSize:[16,16],iconAnchor:[8,8]}),zIndexOffset:500})
   .bindTooltip(nm,{direction:'right',offset:[8,0],className:'lbl dcl'})
   .bindPopup(`<b>🖥 ${nm}</b><br>${loc}${approx?' <i>(approximate location)</i>':''}<br>Owner/partner: ${own}<br>${size}`).addTo(dcLayer);});
 info.innerHTML=`<button id="ic">✕</button><h2 style="color:${l.c}">${l.n}</h2>
 <div class="meta">${l.rank?`#${l.rank} · ${l.top} · index ${l.score}`:'Unranked · no public model'}</div>
 <p>${l.desc}</p><p class="meta">HQ: ${l.ad}</p>
 <p class="meta">🖥 ${l.dc.length} datacenter${l.dc.length==1?'':'s'} shown${l.gap?'. '+l.gap:''}</p>
 <a href="${l.u}" target="_blank" rel="noopener">${l.u.replace('https://','')}</a>`;
 info.style.display='block';document.getElementById('ic').onclick=closeInfo;
 panel.style.maxHeight=`calc(100% - ${info.offsetHeight+50}px)`;
 const bot=info.offsetHeight+20, left=innerWidth<600?20:260;
 if(pts.length>1)map.flyToBounds(pts,{paddingTopLeft:[innerWidth<600?20:left,60],paddingBottomRight:[40,bot],maxZoom:10});
 else map.flyTo([l.la,l.lo],12);
 if(innerWidth<600)panel.classList.add('closed');
}
function closeInfo(){info.style.display='none';panel.style.maxHeight='';dcLayer.clearLayers();}
LABS.forEach(l=>{
 const off={right:[10,0],left:[-10,0],top:[0,-10],bottom:[0,10]}[l.d];
 const mk=L.marker([l.la,l.lo],{icon:L.divIcon({className:'',html:`<div class="dot" style="background:${l.c};color:${l.c}"></div>`,iconSize:[18,18],iconAnchor:[9,9]})})
  .bindTooltip(l.n,{permanent:true,direction:l.d,offset:off,className:'lbl'})
  .bindPopup(`<b>${l.n}</b><br>Top model: ${l.top}<br>HQ: ${l.ad}<br><a href="${l.u}" target="_blank" rel="noopener">${l.u.replace('https://','')}</a>`);
 mk.on('click',()=>select(l));cl.addLayer(mk);
 const li=document.createElement('li');li.innerHTML=`<span class="rk">${l.rank?'#'+l.rank:'–'}</span>${l.n}<small>${l.top}${l.score?' · '+l.score:''} · ${l.city}</small>`;
 li.onclick=()=>select(l);list.appendChild(li);});
map.addLayer(cl);map.fitBounds(cl.getBounds(),{padding:[30,30]});

</script></body></html>
